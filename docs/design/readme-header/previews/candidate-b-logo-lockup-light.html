<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#ffffff; }
  .markdown-body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:#1f2328; background:#ffffff; max-width: 780px; margin: 0 auto; padding: 32px 24px;
    font-size: 16px; line-height: 1.5;
  }
  .header { text-align:center; margin-bottom: 20px; }
  .header img.lockup { height: 32px; margin-bottom: 8px; }
  .header .subtitle { color:#59636e; font-size: 14px; margin: 0 0 14px; }
  .badges { text-align:center; margin-bottom: 20px; }
  .badges img { height: 20px; margin: 0 3px 8px 0; vertical-align: middle; }
  hr { border:0; border-top:1px solid #d1d9e0; margin: 20px 0; }
  p { margin: 0 0 16px; }
  code { background:#818b981f; padding:.2em .4em; border-radius:6px; font-size:85%; font-family: ui-monospace, SFMono-Regular, monospace; }
</style>
</head>
<body>
<div class="markdown-body">
  <div class="header">
    <img class="lockup" src="../taxlane-lockup-on-light.svg" alt="TaxLane">
    <p class="subtitle">PHP SDK for the TaxLane Developer API</p>
  </div>
  <p class="badges">
    <img src="https://img.shields.io/badge/packagist-v1.4.0-3B82F6">
    <img src="https://img.shields.io/badge/downloads-12.3k-3B82F6">
    <img src="https://img.shields.io/badge/php-%3E%3D8.0-8892BF">
    <img src="https://img.shields.io/badge/license-MIT-brightgreen">
  </p>
  <hr>
  <p>Official PHP SDK for <a href="#">TaxLane</a>'s free
  <a href="#">Developer API</a> — PAYE, VAT, Withholding Tax,
  Companies Income Tax, Capital Gains Tax, and 6 more Nigeria tax calculators,
  as static method calls instead of hand-written <code>curl</code>.</p>
</div>
</body>
</html>
