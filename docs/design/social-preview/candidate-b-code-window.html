<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    background: #F2F2F2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .header {
    position: absolute;
    top: 64px;
    left: 96px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header .wordmark {
    font-size: 30px;
    font-weight: 600;
    color: #12131A;
    letter-spacing: -0.3px;
  }
  .header .wordmark .dim { color: rgba(18,19,26,0.42); font-weight: 400; }
  .tagline {
    position: absolute;
    top: 128px;
    left: 96px;
    font-size: 20px;
    color: rgba(18,19,26,0.68);
  }
  .window {
    position: absolute;
    left: 96px;
    top: 196px;
    width: 1088px;
    height: 360px;
    background: #12131A;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(18,19,26,0.18);
    overflow: hidden;
  }
  .titlebar {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    background: rgba(242,242,242,0.04);
    border-bottom: 1px solid rgba(242,242,242,0.08);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .code {
    padding: 48px 40px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 20px;
    line-height: 2.2;
    color: #F2F2F2;
    white-space: pre;
  }
  .code .kw { color: #34D399; }
  .code .str { color: #F2C94C; }
  .code .cmt { color: rgba(242,242,242,0.4); }
  .mark-corner { position: absolute; }
</style>
</head>
<body>
  <div class="header">
    <svg width="34" height="34" viewBox="0 0 32 32">
      <rect x="6" y="17" width="5" height="9" rx="1.5" fill="#12131A"/>
      <rect x="13.5" y="12" width="5" height="14" rx="1.5" fill="#12131A"/>
      <rect x="21" y="6" width="5" height="20" rx="1.5" fill="#0B8457"/>
    </svg>
    <div class="wordmark">quineworks<span class="dim">/taxlane</span></div>
  </div>
  <div class="tagline">PHP SDK for Nigeria's tax calculators &mdash; no API key, no account, no Guzzle.</div>

  <div class="window">
    <div class="titlebar">
      <div class="dot" style="background:#FF5F57"></div>
      <div class="dot" style="background:#FEBC2E"></div>
      <div class="dot" style="background:#28C840"></div>
    </div>
    <div class="code"><span class="kw">use</span> TaxLane\TaxLane;

TaxLane::calculatePaye([<span class="str">'grossAnnualIncome'</span> =&gt; 6_000_000])[<span class="str">'data'</span>];
<span class="cmt">// ['taxableIncome' =&gt; 6000000, 'payeTax' =&gt; 870000,
//  'monthlyTax' =&gt; 72500, ...]</span></div>
  </div>
</body>
</html>
