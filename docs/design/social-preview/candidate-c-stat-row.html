<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    background: #12131A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .lockup { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
  .wordmark {
    font-size: 46px;
    font-weight: 600;
    color: #F2F2F2;
    letter-spacing: -0.5px;
  }
  .wordmark .dim { color: rgba(242,242,242,0.45); font-weight: 400; }
  .tagline {
    font-size: 23px;
    color: rgba(242,242,242,0.75);
    margin-bottom: 56px;
  }
  .stats {
    display: flex;
    gap: 0;
    align-items: stretch;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 48px;
  }
  .stat .num {
    font-size: 52px;
    font-weight: 700;
    color: #34D399;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .stat .label {
    font-size: 17px;
    color: rgba(242,242,242,0.6);
    margin-top: 6px;
    text-align: center;
  }
  .divider {
    width: 1px;
    background: rgba(242,242,242,0.14);
    align-self: center;
    height: 64px;
  }
</style>
</head>
<body>
  <div class="center">
    <div class="lockup">
      <svg width="52" height="52" viewBox="0 0 28 28">
        <rect x="6" y="15" width="5" height="9" rx="1.2" fill="#F2F2F2"/>
        <rect x="13.5" y="10" width="5" height="14" rx="1.2" fill="#F2F2F2"/>
        <rect x="21" y="4" width="5" height="20" rx="1.2" fill="#34D399"/>
      </svg>
      <div class="wordmark">taxlane<span class="dim">-php</span></div>
    </div>
    <div class="tagline">Nigeria tax calculators as static PHP method calls</div>
    <div class="stats">
      <div class="stat"><div class="num">10</div><div class="label">calculators</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="num">0</div><div class="label">dependencies</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="num">0</div><div class="label">API keys</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="num">MIT</div><div class="label">license</div></div>
    </div>
  </div>
</body>
</html>
